<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    Compact view: Core's record table in a denser form, with the record ID,
    one line per record and the translations of a record right below it,
    including the languages it still lacks. Columns follow the list view:
    selection, icon, title, controls, localization, then the fields.
</f:comment>

<records-list-types-actions class="rlt-view rlt-view--compact">
<div class="recordlist-compactview-container">
    <f:for each="{tableData}" as="table">
        <f:render partial="Table/Section" arguments="{table: table, currentTable: currentTable}" contentAs="body">
            <div class="table-fit rlt-compact">
                <table data-table="{table.tableName}" class="table table-striped table-hover table-sm rlt-compact-table">
                    <thead>
                        <tr>
                            <f:if condition="{table.multiSelectEnabled}">
                                <th class="col-checkbox" scope="col"><f:render partial="Table/SelectionToggle" arguments="{id: 'rlt-selection-{table.tableIdentifier}'}" /></th>
                            </f:if>
                            <th class="col-icon" scope="col"><span class="visually-hidden"><f:translate key="records_list_types.messages:column.recordType" /></span></th>
                            <f:for each="{table.sortableColumnHeaders}" as="header">
                                <th class="col-{header.type}" scope="col"{f:if(condition: header.header.isAscActive, then: ' aria-sort="ascending"')}{f:if(condition: header.header.isDescActive, then: ' aria-sort="descending"')}>
                                    <f:render partial="SortableColumnHeader" arguments="{header: header.header, id: 'rlt-column-{table.tableIdentifier}-{header.field}'}" />
                                </th>
                                <f:if condition="{header.type} == 'title'">
                                    <th class="col-control" scope="col">
                                        <f:if condition="{table.bulkEditHeader}">
                                            <f:then>
                                                <button type="button"
                                                        class="btn btn-default t3js-record-edit-multiple"
                                                        title="{table.bulkEditHeader.label}"
                                                        aria-label="{table.bulkEditHeader.label}"
                                                        data-return-url="{table.bulkEditHeader.returnUrl}"
                                                        data-columns-only="{table.bulkEditHeader.columnsOnly}">
                                                    <core:icon identifier="actions-document-open" size="small" />
                                                </button>
                                            </f:then>
                                            <f:else>
                                                <span class="visually-hidden"><f:translate key="core.core:labels._CONTROL_" /></span>
                                            </f:else>
                                        </f:if>
                                    </th>
                                    <f:if condition="{table.isLanguageAware}">
                                        <th class="col-localization" scope="col"><i><f:translate key="core.core:labels._LOCALIZATION_" /></i></th>
                                    </f:if>
                                </f:if>
                            </f:for>
                        </tr>
                    </thead>
                    <tbody data-multi-record-selection-row-selection="true">
                        <f:for each="{table.records}" as="record">
                            <f:render partial="CompactRow" arguments="{record: record, table: table}" />
                            <f:for each="{record.translations}" as="translation">
                                <f:render partial="TranslationRowCompact" arguments="{record: record, translation: translation, table: table}" />
                            </f:for>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:render>
    </f:for>
</div>
</records-list-types-actions>

</html>
