<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    Text badges for the states the icon overlay only hints at, so they do
    not depend on colour or a small overlay alone: hidden, the workspace
    state and free-mode translations.
</f:comment>

<f:if condition="{record.hidden}">
    <span class="badge badge-warning" data-rlt-hidden-badge><f:translate key="records_list_types.messages:state.hidden" /></span>
</f:if>
<f:if condition="{record.workspaceState}">
    <span class="badge badge-info" title="{record.workspaceStateTitle}">{record.workspaceStateLabel}</span>
</f:if>
<f:if condition="{record.isFreeTranslation}">
    <span class="badge badge-notice" title="{f:translate(key: 'records_list_types.messages:translation.free.title')}">
        <f:translate key="records_list_types.messages:translation.free" />
        <f:if condition="{record.languageTitle}">· {record.languageTitle}</f:if>
    </span>
</f:if>

</html>
