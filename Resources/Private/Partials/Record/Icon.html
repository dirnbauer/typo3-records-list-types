<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    The record icon with its state overlays and the button that opens the
    context menu, rendered by Core (DatabaseRecordList markup). Records that
    did not pass through the view pipeline fall back to the plain icon.
</f:comment>

<f:if condition="{record.iconHtml}">
    <f:then><f:format.raw>{record.iconHtml}</f:format.raw></f:then>
    <f:else><core:icon identifier="{record.iconIdentifier}" size="small" /></f:else>
</f:if>

</html>
