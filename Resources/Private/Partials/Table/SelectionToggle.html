<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    Core's "Check all / Uncheck all / Toggle selection" menu, as
    DatabaseRecordList renders it in the head of the list view, opened as a
    popover so a scrolling table cannot clip it. It works anywhere inside the
    element with data-multi-record-selection-identifier.

    Arguments: id (unique id of the menu)
</f:comment>

<div class="btn-group dropdown">
    <button type="button"
            class="dropdown-toggle dropdown-toggle-link t3js-multi-record-selection-check-actions-toggle"
            popovertarget="{id}"
            aria-label="{f:translate(key: 'core.core:labels.openSelectionOptions')}">
        <core:icon identifier="actions-selection" size="small" />
    </button>
    <ul class="dropdown-menu t3js-multi-record-selection-check-actions" id="{id}" popover>
        <li>
            <button type="button" class="dropdown-item" disabled data-multi-record-selection-check-action="check-all" title="{f:translate(key: 'core.core:labels.checkAll')}">
                <core:icon identifier="actions-selection-elements-all" size="small" />
                <f:translate key="core.core:labels.checkAll" />
            </button>
        </li>
        <li>
            <button type="button" class="dropdown-item" disabled data-multi-record-selection-check-action="check-none" title="{f:translate(key: 'core.core:labels.uncheckAll')}">
                <core:icon identifier="actions-selection-elements-none" size="small" />
                <f:translate key="core.core:labels.uncheckAll" />
            </button>
        </li>
        <li>
            <button type="button" class="dropdown-item" disabled data-multi-record-selection-check-action="toggle" title="{f:translate(key: 'core.core:labels.toggleSelection')}">
                <core:icon identifier="actions-selection-elements-invert" size="small" />
                <f:translate key="core.core:labels.toggleSelection" />
            </button>
        </li>
    </ul>
</div>

</html>
