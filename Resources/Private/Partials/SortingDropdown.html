<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    Sorting by column: direction and the column to sort by.

    Arguments: sortingDropdown, id (unique id of the menu), current (1 inside the sorting mode group)
</f:comment>

<f:if condition="{sortingDropdown}">
    <button type="button"
            class="btn btn-default dropdown-toggle{f:if(condition: current, then: ' active')}"
            popovertarget="{id}"
            {f:if(condition: current, then: 'aria-current="true"')}>
        <core:icon identifier="{sortingDropdown.sortIconIdentifier}" size="small" />
        {sortingDropdown.fieldModeLabel}<f:if condition="{sortingDropdown.currentFieldLabel}">: {sortingDropdown.currentFieldLabel}</f:if>
    </button>
    <ul class="dropdown-menu" id="{id}" popover>
        <li>
            <a class="dropdown-item{f:if(condition: sortingDropdown.isAscActive, then: ' active')}" href="{sortingDropdown.ascUrl}"{f:if(condition: sortingDropdown.isAscActive, then: ' aria-current="true"')}>
                <core:icon identifier="actions-sort-amount-up" size="small" />
                {sortingDropdown.ascLabel}
            </a>
        </li>
        <li>
            <a class="dropdown-item{f:if(condition: sortingDropdown.isDescActive, then: ' active')}" href="{sortingDropdown.descUrl}"{f:if(condition: sortingDropdown.isDescActive, then: ' aria-current="true"')}>
                <core:icon identifier="actions-sort-amount-down" size="small" />
                {sortingDropdown.descLabel}
            </a>
        </li>
        <li><hr class="dropdown-divider" aria-hidden="true"></li>
        <f:for each="{sortingDropdown.items}" as="item">
            <li>
                <a class="dropdown-item{f:if(condition: item.isActive, then: ' active')}" href="{item.url}"{f:if(condition: item.isActive, then: ' aria-current="true"')}>
                    {item.label}
                </a>
            </li>
        </f:for>
    </ul>
</f:if>

</html>
